version: "3.8"

services:
  db:
    image: ankane/pgvector:latest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./scripts/docker/init-electric-user.sh:/docker-entrypoint-initdb.d/init-electric-user.sh:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-surfsense}
      - ELECTRIC_DB_USER=${ELECTRIC_DB_USER:-electric}
      - ELECTRIC_DB_PASSWORD=${ELECTRIC_DB_PASSWORD:-electric_password}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@surfsense.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-surfsense}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  ollama:
    image: ollama/ollama:latest
    # Enable NVIDIA GPU access (requires NVIDIA Container Toolkit on the host)
    gpus: all
    environment:
      # Keep the last-loaded model in memory longer to avoid repeated 15-60s cold loads.
      - OLLAMA_KEEP_ALIVE=-1
      # Avoid loading multiple large models concurrently on a single GPU.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-4}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Periodically pings key models so they stay warm in Ollama.
  # This is intentionally a separate container so it can be restarted independently.
  ollama_keepalive:
    image: curlimages/curl:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: ["sh /scripts/ollama_keepalive.sh"]
    environment:
      - OLLAMA_URL=http://ollama:11434
      # Keep these aligned with backend config to avoid runner reloads.
      # Hardcode to avoid accidentally inheriting host env overrides.
      - OLLAMA_KEEPALIVE_CHAT_MODEL=qwen3:30b-a3b
      - OLLAMA_KEEPALIVE_CHAT_NUM_CTX=32768
      - OLLAMA_KEEPALIVE_RERANK_MODEL=dengcao/Qwen3-Reranker-0.6B:Q8_0
      - OLLAMA_KEEPALIVE_RERANK_NUM_CTX=2048
      - OLLAMA_KEEPALIVE_DURATION=2h
      - OLLAMA_KEEPALIVE_REFRESH_SECS=3600
    volumes:
      - ./scripts/ollama_keepalive.sh:/scripts/ollama_keepalive.sh:ro
    restart: unless-stopped

  backend:
    build: ./surfsense_backend
    # image: ghcr.io/modsetter/surfsense_backend:latest
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./surfsense_backend/app:/app/app
      - ./surfsense_backend/scripts:/app/scripts
      - shared_temp:/tmp
      # Local ingest folder (Celestia forum markdown lives under /mnt/data/surfsense/docs)
      - /mnt/data/surfsense/docs:/ingest/docs:ro
      # Uncomment and edit the line below to enable Obsidian vault indexing
      # - /path/to/your/obsidian/vault:/obsidian-vault:ro
    env_file:
      - ./surfsense_backend/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-surfsense}
      - CELERY_BROKER_URL=redis://redis:${REDIS_PORT:-6379}/0
      - CELERY_RESULT_BACKEND=redis://redis:${REDIS_PORT:-6379}/0
      # Queue name isolation - prevents task collision if Redis is shared with other apps
      - CELERY_TASK_DEFAULT_QUEUE=surfsense
      - PYTHONPATH=/app
      - UVICORN_LOOP=asyncio
      - UNSTRUCTURED_HAS_PATCHED_LOOP=1
      - LANGCHAIN_TRACING_V2=false
      - LANGSMITH_TRACING=false
      - ELECTRIC_DB_USER=${ELECTRIC_DB_USER:-electric}
      - ELECTRIC_DB_PASSWORD=${ELECTRIC_DB_PASSWORD:-electric_password}
      - NEXT_FRONTEND_URL=${NEXT_FRONTEND_URL:-http://frontend:3000}
      # Disable self-serve signups for this deployment (UI link is also hidden).
      - REGISTRATION_ENABLED=TRUE
      - SURFSENSE_DISABLE_INGEST_SUMMARY=TRUE
      # Ollama request timeouts: large models can take >30s to cold-load.
      - SURFSENSE_OLLAMA_REQUEST_TIMEOUT=${SURFSENSE_OLLAMA_REQUEST_TIMEOUT:-180}
      # Chat grounding: run a backend pre-search over FILE docs and return matches directly for
      # lookup-style queries ("Find/Show/Quote/Which post"). This avoids local-model tool-calling
      # failures and makes chat return exact ingested content.
      - SURFSENSE_CHAT_PRESEARCH_ENABLED=TRUE
      - SURFSENSE_CHAT_LOOKUP_BYPASS=${SURFSENSE_CHAT_LOOKUP_BYPASS:-TRUE}
      - SURFSENSE_CHAT_PRESEARCH_TOP_K=${SURFSENSE_CHAT_PRESEARCH_TOP_K:-8}
      - SURFSENSE_CHAT_PRESEARCH_MAX_DOCS=${SURFSENSE_CHAT_PRESEARCH_MAX_DOCS:-3}
      - SURFSENSE_CHAT_PRESEARCH_MAX_CHARS=${SURFSENSE_CHAT_PRESEARCH_MAX_CHARS:-24000}
    depends_on:
      - db
      - redis
      - ollama

  electric:
    image: electricsql/electric:latest
    ports:
      - "${ELECTRIC_PORT:-5133}:3000"
    environment:
      - DATABASE_URL=${ELECTRIC_DATABASE_URL:-postgresql://${ELECTRIC_DB_USER:-electric}:${ELECTRIC_DB_PASSWORD:-electric_password}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-surfsense}?sslmode=disable}
      - ELECTRIC_INSECURE=true
      - ELECTRIC_WRITE_TO_PG_MODE=direct
    restart: unless-stopped
    # depends_on:
    #   - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./surfsense_web
      # image: ghcr.io/modsetter/surfsense_ui:latest
      args:
        NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${NEXT_PUBLIC_FASTAPI_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE: ${NEXT_PUBLIC_FASTAPI_BACKEND_AUTH_TYPE:-LOCAL}
        NEXT_PUBLIC_ETL_SERVICE: ${NEXT_PUBLIC_ETL_SERVICE:-DOCLING}
        NEXT_PUBLIC_REGISTRATION_ENABLED: ${NEXT_PUBLIC_REGISTRATION_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./surfsense_web/.env
    environment:
      - NEXT_PUBLIC_ELECTRIC_URL=${NEXT_PUBLIC_ELECTRIC_URL:-http://localhost:5133}
      - NEXT_PUBLIC_ELECTRIC_AUTH_MODE=insecure
    depends_on:
      - backend
      - electric

  sync-agent:
    build: ./surfsense_backend
    command: python /app/scripts/sync_loop.py
    volumes:
      - ./surfsense_backend/app:/app/app
      - ./surfsense_backend/scripts:/app/scripts
      - /mnt/data/surfsense/docs:/ingest/docs
    env_file:
      - ./surfsense_backend/.env
    environment:
      - DOCS_ROOT=/ingest/docs
      - SYNC_INTERVAL_HOURS=24
      - SEARCH_SPACE_ID=5
      - USER_EMAIL=ant.kampo@gmail.com
      - SURFSENSE_DISABLE_INGEST_SUMMARY=TRUE
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-surfsense}
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:3000
    restart: unless-stopped
    depends_on:
      - frontend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  shared_temp:
  ollama_data:
  es_data:
